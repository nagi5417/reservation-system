spring:
  application:
    name: reservation

  # MVC設定（404例外を投げるように設定）
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # データソース設定
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservation_db}
    username: ${DB_USERNAME:reservation_user}
    password: ${DB_PASSWORD:reservation_pass}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate設定
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # メール設定 (MailHog)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # OAuth2設定 (Google)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope:
              - email
              - profile
              - https://www.googleapis.com/auth/calendar
            redirect-uri: "${APP_BASE_URL:http://localhost:5173}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# Swagger/OpenAPI設定
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# アプリケーション設定
app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: noreply@reservation-system.com

# ログ設定
logging:
  level:
    com.example.reservation: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
